// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    // Build output folder: set -Pkh.outdir=<dir> to keep it elsewhere (e.g. a Linux fs when the source sits on a drive that rejects chmod); default <root>/build_out
    layout.buildDirectory = file("${findProperty('kh.outdir') ?: rootDir.absolutePath + '/build_out'}/${project.name}")
    repositories {
        mavenCentral()
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
